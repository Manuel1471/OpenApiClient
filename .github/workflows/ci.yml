name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Electron downloads its platform binary in its own installer. Run it explicitly
      # so a restored npm cache cannot leave the package without Electron.app.
      - run: node node_modules/electron/install.js
      - run: node -e "console.log(require('electron'))"
      - run: npm test
      - run: npm run test:e2e
