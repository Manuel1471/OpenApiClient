name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Ensures Electron's platform binary is restored even when npm cache is warm.
      - run: npm rebuild electron
      - run: npm test
      - run: npm run test:e2e
