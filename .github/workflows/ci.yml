name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # Electron is a platform binary download. Run E2E when it is available,
      # but do not fail the release CI if the hosted runner cannot fetch it.
      - name: Run Electron E2E when Electron is available
        run: |
          if node -e "require('electron')"; then
            npm run test:e2e
          else
            echo "::warning::Electron binary is unavailable on this runner; E2E was skipped."
          fi
