<!-- TabContent Component -->
<div class="tab-content">
    <!-- Tab Params -->
    <div class="tab-panel active" id="paramsPanel">
        <div class="key-value-editor">
            <div class="kv-header">
                <span>Key</span>
                <span>Value</span>
                <span></span>
            </div>
            <div class="kv-rows" id="paramsRows">
                <div class="kv-row">
                    <input type="text" class="kv-key" placeholder="nombre">
                    <input type="text" class="kv-value" placeholder="valor">
                    <button class="btn-remove">×</button>
                </div>
            </div>
            <button class="btn-add-row" id="addParamBtn">+ Agregar</button>
        </div>
    </div>

    <!-- Tab Headers -->
    <div class="tab-panel" id="headersPanel">
        <div class="key-value-editor">
            <div class="kv-header">
                <span>Key</span>
                <span>Value</span>
                <span></span>
            </div>
            <div class="kv-rows" id="headersRows">
                <div class="kv-row">
                    <input type="text" class="kv-key" placeholder="Content-Type" value="application/json">
                    <input type="text" class="kv-value" placeholder="application/json" value="application/json">
                    <button class="btn-remove">×</button>
                </div>
            </div>
            <button class="btn-add-row" id="addHeaderBtn">+ Agregar</button>
        </div>
    </div>

    <!-- Tab Body -->
    <div class="tab-panel" id="bodyPanel">
        <div class="body-options">
            <label class="radio-option">
                <input type="radio" name="bodyType" value="none" checked>
                <span>None</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="bodyType" value="raw">
                <span>raw</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="bodyType" value="form-data">
                <span>form-data</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="bodyType" value="x-www-form-urlencoded">
                <span>x-www-form-urlencoded</span>
            </label>
        </div>
        <div class="body-editor-container">
            <select class="body-format-select" id="bodyFormatSelect">
                <option value="json">JSON</option>
                <option value="text">Text</option>
                <option value="xml">XML</option>
            </select>
            <textarea class="body-editor" id="bodyEditor" placeholder='{\n  "key": "value"\n}'></textarea>
        </div>
    </div>

    <!-- Tab Auth -->
    <div class="tab-panel" id="authPanel">
        <div class="auth-selector">
            <select class="auth-type-select" id="authTypeSelect">
                <option value="none">No Auth</option>
                <option value="bearer">Bearer Token</option>
                <option value="basic">Basic Auth</option>
                <option value="apikey">API Key</option>
            </select>
        </div>
        <div class="auth-fields" id="authFields">
            <div class="auth-field">
                <label>Token</label>
                <input type="text" class="auth-input" id="bearerToken" placeholder="Ingresa tu token">
            </div>
        </div>
    </div>
</div>
