<!-- ResponseSection Component -->
<div class="response-section">
  <div class="response-header">
    <span
      class="response-status"
      id="responseStatus"
      data-i18n="response.waiting"
      >Esperando…</span
    >
    <span class="response-meta" id="responseMeta" data-i18n="response.offline"
      >Sin conexión</span
    >
    <div class="response-actions">
      <button
        class="btn-text-small"
        id="copyResponseBtn"
        data-i18n="response.copy"
      >
        Copiar
      </button>
      <button
        class="btn-text-small"
        id="clearResponseBtn"
        data-i18n="response.clear"
      >
        Limpiar
      </button>
      <button class="btn-text-small" id="cancelRequestBtn" disabled data-i18n="response.cancel">
        Cancelar
      </button>
      <button class="btn-text-small" id="compareResponseBtn" data-i18n="response.compare">Comparar</button>
      <button class="btn-text-small" id="exportHistoryBtn" data-i18n="response.exportHistory">
        Exportar historial
      </button>
      <button
        class="btn-text-small"
        id="fullscreenResponseBtn"
        data-i18n-title="response.fullscreen"
        title="Alternar pantalla completa de respuesta"
      >
        ⛶
      </button>
    </div>
  </div>
  <div class="response-resize-handle" role="separator" aria-orientation="horizontal" aria-label="Resize response panel" aria-valuemin="230" aria-valuemax="1200" aria-valuenow="230" tabindex="0" title="Resize response panel"></div>
  <div class="response-tabs">
    <button
      class="response-tab active"
      data-response-tab="body"
      data-i18n="tabs.body"
    >
      Body
    </button>
    <button
      class="response-tab"
      data-response-tab="headers"
      data-i18n="tabs.headers"
    >
      Headers
    </button>
    <button class="response-tab" data-response-tab="diff" data-i18n="response.diff">Diferencias</button>
  </div>
  <div class="response-content">
    <div class="response-panel active" id="responseBodyPanel">
      <pre class="response-body" id="responseBody" data-i18n="response.empty">
La respuesta aparecerá aquí…</pre
      >
    </div>
    <div class="response-panel" id="responseHeadersPanel">
      <pre class="response-headers" id="responseHeaders" data-i18n="response.headersEmpty">
Los headers aparecerán aquí…</pre
      >
    </div>
    <div class="response-panel" id="responseDiffPanel">
      <pre class="response-body" id="responseDiff" data-i18n="response.diffEmpty">
Ejecuta dos requests para compararlas.</pre
      >
    </div>
  </div>
</div>
