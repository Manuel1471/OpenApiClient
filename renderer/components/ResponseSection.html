<!-- ResponseSection Component -->
<div class="response-section">
    <div class="response-header">
        <span class="response-status" id="responseStatus">Esperando...</span>
        <div class="response-actions">
            <button class="btn-text-small" id="copyResponseBtn">Copiar</button>
            <button class="btn-text-small" id="clearResponseBtn">Limpiar</button>
        </div>
    </div>
    <div class="response-tabs">
        <button class="response-tab active" data-response-tab="body">Body</button>
        <button class="response-tab" data-response-tab="headers">Headers</button>
    </div>
    <div class="response-content">
        <div class="response-panel active" id="responseBodyPanel">
            <pre class="response-body" id="responseBody">La respuesta aparecerá aquí...</pre>
        </div>
        <div class="response-panel" id="responseHeadersPanel">
            <pre class="response-headers" id="responseHeaders">Los headers aparecerán aquí...</pre>
        </div>
    </div>
</div>
