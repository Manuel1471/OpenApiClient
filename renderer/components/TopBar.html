<!-- TopBar Component -->
<header class="top-bar">
  <div class="header-left">
    <span class="terminal-prompt">$</span>
    <h1 class="logo">openapi-client</h1>
    <span class="app-version" data-i18n-aria-label="app.version" aria-label="Versión 1.1.0 de OpenAPI Client">v1.1.0</span>
    <span class="connection-indicator"
      ><i></i> <span data-i18n="app.connected">conectado</span></span
    >
  </div>
  <div class="header-right">
    <span class="welcome-label" data-i18n="app.activeSession"
      >sesión activa</span
    >
    <button
      class="user-badge"
      id="userBadge"
      type="button"
      data-i18n-title="account.openSettings"
      title="Abrir configuración de cuenta"
    >
      <span class="user-name" id="userName">Usuario</span>
    </button>
  </div>
</header>
